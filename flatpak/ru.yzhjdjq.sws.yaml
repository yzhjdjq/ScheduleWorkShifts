app-id: ru.yzhjdjq.sws
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: sws

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: sws
    buildsystem: simple
    build-commands:
      - |
        mkdir -p ${FLATPAK_DEST}/bin
        mkdir -p ${FLATPAK_DEST}/share/applications
        mkdir -p ${FLATPAK_DEST}/share/icons/hicolor
        mkdir -p ${FLATPAK_DEST}/data
        mkdir -p ${FLATPAK_DEST}/lib

        cp -r build/linux/x64/release/bundle/* ${FLATPAK_DEST}/
        
        ls -lahR ${FLATPAK_DEST}
        
        if [ -f "${FLATPAK_DEST}/sws" ]; then
          mv "${FLATPAK_DEST}/sws" "${FLATPAK_DEST}/bin/"
        fi
        
        chmod +x ${FLATPAK_DEST}/bin/sws
        
        ls -lahR ${FLATPAK_DEST}

        cat > ${FLATPAK_DEST}/share/applications/ru.yzhjdjq.sws.desktop << EOF
        [Desktop Entry]
        Version=0.3.0
        Type=Application
        Name=Schedule shifts
        Comment=Application for managing work shift schedules
        Exec=sws
        Icon=ru.yzhjdjq.sws
        Categories=Office;
        StartupNotify=true
        EOF

        if [ -d "assets/icon" ]; then
          for size in 16 32 48 64 128 256 512; do
            icon_file="assets/icon/${size}x${size}.png"
            if [ -f "$icon_file" ]; then
              mkdir -p ${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps
              cp "$icon_file" ${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/ru.yzhjdjq.sws.png
            fi
          done
        else
          echo "Иконки не найдены, создаем базовую иконку"
          mkdir -p ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps
          convert -size 64x64 xc:blue ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps/ru.yzhjdjq.sws.png 2>/dev/null || true
        fi

    sources:
      - type: dir
        path: ../
        exclude:
          - flatpak/build-dir/
          - flatpak/repo/
          - flatpak/*.flatpak
          - .dart_tool/
          - .git/
          - build/linux/x64/debug/